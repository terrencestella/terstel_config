#!/bin/bash
# Ntfy server configuration for Claude Code mobile notifications
# Set NTFY_TOKEN in .env file

# Ntfy server URL
NTFY_SERVER="https://ntfy.terrencestella.nl"

# Idle threshold in seconds (only notify if terminal idle for this long)
# Set to 0 to disable idle detection and always notify
IDLE_THRESHOLD=120

# Device to ntfy topic mapping
# The script checks tailscale status for the SSH client IP and matches device names
declare -A DEVICE_TOPICS
DEVICE_TOPICS["iphone-13"]="cc-iphone"
DEVICE_TOPICS["ipad-9th-gen-wifi"]="cc-ipad"
DEVICE_TOPICS["unknown"]="cc-unknown"  # Fallback for unrecognized devices (optional)

# Optional: shared topic to ALSO send notifications to (uncomment to enable)
# SHARED_TOPIC="cc-both"
